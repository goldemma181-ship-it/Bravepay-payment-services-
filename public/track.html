<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Track your order — BRAVE</title><link rel="stylesheet" href="/styles.css"></head><body>
<header><div class="nav"><a class="logo" href="/">✦ <b>BRAVE</b></a><nav><a href="/#services">Services</a><a href="/terms">Terms</a><a href="/refund">Refund policy</a></nav><button onclick="location.href='/#services'">Get started</button></div></header>
<div class="trackwrap"><div class="center" style="margin-bottom:10px"><small>ORDER TRACKING</small><h2>Where is my order?</h2><p style="color:#686b65">Enter the order ID from your confirmation (looks like <b>BRV-XXXXXXXXXX</b>) and the email you used.</p></div>
<form class="trackform card" id="f" style="width:100%"><label>Order ID<input id="oid" required placeholder="BRV-8A2F91CD" style="text-transform:uppercase"></label><label>Email used for the order<input id="em" type="email" required placeholder="you@example.com"></label><button class="full" id="btn">Track order →</button></form>
<div id="res"></div></div>
<footer><div class="wrap foot"><div><a class="logo" href="/">✦ <b>BRAVE</b></a><p>Social growth services and creator tools.</p></div><div><b>Explore</b><a href="/#services">Services</a><a href="/terms">Terms</a><a href="/privacy">Privacy</a><a href="/refund">Refund policy</a></div></div></footer>
<script>
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pill=s=>'<span class="pill st-'+s+'">'+esc(s).replace(/_/g,' ')+'</span>';
async function lookup(id,em,push){const r=await fetch('/api/track/'+encodeURIComponent(id)+'?email='+encodeURIComponent(em));const d=await r.json();if(!r.ok)throw new Error(d.error||'Not found');render(d,push)}
function render(d,push){let rows=[['Status',pill(d.status)],['Service',esc(d.service)+' · '+esc(d.platform)],['Package',esc(d.option)+' × '+esc(d.quantity)],['Target',esc(d.targetMasked)],['Total','₦'+Number(d.total).toLocaleString('en-NG')],['Payment',esc((d.payment&&d.payment.method||'—').replace(/_/g,' '))+' · '+esc((d.payment&&d.payment.status||'unpaid').replace(/_/g,' '))],['Placed',new Date(d.createdAt).toLocaleString()]];if(d.payment&&d.payment.paidAt)rows.push(['Paid',new Date(d.payment.paidAt).toLocaleString()]);document.getElementById('res').innerHTML='<div class="trackcard"><div style="display:flex;justify-content:space-between;align-items:center"><h3 style="margin:0">'+esc(d.id)+'</h3>'+pill(d.status)+'</div><div style="margin-top:12px">'+rows.map(r=>'<div class="trow"><span>'+r[0]+'</span><b>'+r[1]+'</b></div>').join('')+'</div>'+(d.history&&d.history.length?'<b style="font-size:13px">Progress</b><ul class="tl">'+d.history.map(h=>'<li><small>'+new Date(h.at).toLocaleString()+'</small><span>'+(h.from?esc(h.from).replace(/_/g,' ')+' → ':'')+'<b>'+esc(h.to).replace(/_/g,' ')+'</b></span></li>').join('')+'</ul>':'')+'</div>';if(push)history.replaceState(null,'','/track?id='+encodeURIComponent(d.id))}
document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const b=document.getElementById('btn');b.disabled=true;try{await lookup(document.getElementById('oid').value.trim().toUpperCase(),document.getElementById('em').value.trim(),true)}catch(err){document.getElementById('res').innerHTML='<div class="trackcard" style="border-color:#eec4c4;background:#fdf3f3"><b>No order found.</b><p style="color:#777;font-size:13px">'+esc(err.message)+' Check the ID and email, or contact support if you just paid.</p></div>'}b.disabled=false});
(async()=>{const p=new URLSearchParams(location.search);const id=(p.get('id')||'').toUpperCase();if(!id)return;document.getElementById('oid').value=id;const saved=localStorage.getItem('braveTrackEmail');if(saved){document.getElementById('em').value=saved;try{await lookup(id,saved,true)}catch(e){}}})();
</script>
</body></html>
